<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.ico" />
    <title>广联二手车发拍管理系统</title>
    <script>
      // GitHub Pages SPA 路由恢复：从 sessionStorage 中读取 404.html 存入的路径，并用 history.replaceState 恢复
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          try {
            var info = JSON.parse(redirect);
            // 只恢复 /auction-management/admin/ 之后的子路径
            var base = '/auction-management/admin';
            var target = info.pathname;
            // 提取 base 路径之后的部分
            var sub = target.startsWith(base) ? target.slice(base.length) : target;
            if (sub && sub !== '/') {
              history.replaceState(null, '', sub + (info.search || '') + (info.hash || ''));
            }
          } catch (e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
