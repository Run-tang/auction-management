<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>二手车发拍管理后台</title>
    <script>
      // GitHub Pages SPA 路由兼容方案
      // 将路径编码后通过 sessionStorage 传给 index.html，再由 index.html 恢复
      var l = window.location;
      sessionStorage.redirect = l.pathname + l.search + l.hash;
      l.replace(l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1 + 1).join('/') + '/?p=1');
    </script>
  </head>
  <body></body>
</html>
