<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>广联二手车发拍管理系统</title>
    <script>
      // GitHub Pages SPA 路由兼容方案（最稳定版）
      // 原理：将当前 URL 的路径信息存入 sessionStorage，然后跳转到 index.html
      // index.html 加载后从 sessionStorage 读取并用 history.replaceState 恢复路径
      sessionStorage.setItem('spa_redirect', JSON.stringify({
        pathname: location.pathname,
        search: location.search,
        hash: location.hash
      }));
      // 跳到 /auction-management/admin/
      location.replace('/auction-management/admin/');
    </script>
  </head>
  <body></body>
</html>
