<!DOCTYPE html>
<html>

    <title>广联二手车 - 经销商端</title>

      // GitHub Pages SPA 路由兼容方案（sessionStorage）
      sessionStorage.setItem('spa_redirect', JSON.stringify({

        search: location.search,
        hash: location.hash
      }));
      location.replace('/auction-management/dealer/');
    </script>
  </head>
